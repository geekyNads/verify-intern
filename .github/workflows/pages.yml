# Publishes the checker to GitHub Pages so students can use it with nothing
# installed. One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: Publish site

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "data/**"
      - "tools/build_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A broken record must never reach the public page.
      - name: Validate the dataset
        run: python tools/validate_data.py

      - name: Build the site
        run: python tools/build_site.py --repo "${{ github.repository }}"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
